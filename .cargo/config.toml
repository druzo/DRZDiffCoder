# .cargo/config.toml
# Cross-compilation linker mappings. Modern cargo only supports the `linker`
# key under [target.*]; the C compiler / archiver are picked from CC_<triple>
# / AR_<triple> env vars, which scripts/release/{check,build-*.sh} export.

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# osxcross produces darwin20.4 wrappers (Big Sur SDK) by default. Cargo's
# default target macOS linker name is darwin21.4 (Ventura). Override to match
# the osxcross toolchain installed under $OSXCROSS/target/bin/.
[target.x86_64-apple-darwin]
linker = "x86_64-apple-darwin20.4-clang"

[target.aarch64-apple-darwin]
linker = "aarch64-apple-darwin20.4-clang"
